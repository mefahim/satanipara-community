<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173F35">
<title>Satanipara Community — Admin Dashboard (Demo)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>সা</text></svg>">
<meta name="description" content="Design-only admin dashboard prototype for Satanipara Community. Simulated demo data; no real authentication.">
<!-- Fonts: Anek Bangla (Bengali) + Manrope (English) via Google Fonts CDN, with robust
     fallbacks (Noto Sans Bengali, system sans) declared in tokens.css. Direction D's
     no-runtime-font rule is noted in README.md — the CDN link is a prototype convenience
     and the fallbacks keep the UI usable offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<!-- Persistent overlay roots (v2): the shell renders once and only #view
     re-renders per route, so modals, drawers and toasts survive navigation.
     They live OUTSIDE #app so no render can wipe them. -->
<div id="app"></div>
<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
<noscript><p style="padding:24px">This prototype needs JavaScript. / এই প্রোটোটাইপের জন্য জাভাস্ক্রিপ্ট প্রয়োজন।</p></noscript>
</body>
</html>
